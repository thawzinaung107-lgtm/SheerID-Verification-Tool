<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canva Teacher Document Generator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      margin: 0;
      padding: 40px 20px;
      color: #333;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      border-radius: 16px;
      padding: 32px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { margin-top: 0; font-size: 1.6rem; }
    .subtitle { color: #666; margin-bottom: 24px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 1rem;
    }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 600px) { .row { grid-template-columns: 1fr; } }
    button {
      width: 100%;
      padding: 14px;
      background: #667eea;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #5a6fd6; }
    button:disabled { background: #aaa; cursor: not-allowed; }
    .result {
      margin-top: 24px;
      padding: 16px;
      border-radius: 8px;
      background: #f8f9fa;
      display: none;
    }
    .result.show { display: block; }
    .result img {
      max-width: 100%;
      border: 1px solid #ddd;
      border-radius: 8px;
      margin-top: 12px;
    }
    .result a {
      display: inline-block;
      margin-top: 12px;
      padding: 10px 16px;
      background: #28a745;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
    }
    .error { color: #dc3545; margin-top: 12px; }
    .loading { text-align: center; color: #666; margin-top: 12px; }
    .doc-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }
    .doc-card {
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .doc-card img { max-width: 100%; border-radius: 4px; }
    .doc-card a { margin-top: 8px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Canva Teacher Document Generator</h1>
    <p class="subtitle">Generate UK teacher documents for Canva Education verification.</p>

    <form id="genForm">
      <div class="row">
        <div class="form-group">
          <label for="name">Teacher Name</label>
          <input type="text" id="name" placeholder="e.g. Alice Wang">
        </div>
        <div class="form-group">
          <label for="country">Country</label>
          <select id="country">
            <option value="" disabled selected>Loading countries...</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="school">School</label>
          <select id="school" disabled>
            <option value="" disabled selected>Select country first</option>
          </select>
        </div>
      </div>

      <div class="row">
        <div class="form-group">
          <label for="position">Position</label>
          <input type="text" id="position" placeholder="e.g. Head of Mathematics">
        </div>
        <div class="form-group">
          <label for="docType">Document Type</label>
          <select id="docType">
            <option value="all">All 3 documents</option>
            <option value="teacher_id">Teacher ID Card</option>
            <option value="employment_letter">Employment Letter</option>
            <option value="teaching_license">Teaching License</option>
          </select>
        </div>
      </div>

      <button type="submit" id="submitBtn">Generate Documents</button>
    </form>

    <div id="loading" class="loading" style="display:none;">Generating, please wait (~5-15s)...</div>
    <div id="error" class="error"></div>

    <div id="result" class="result">
      <h3>Generated Documents</h3>
      <div id="info"></div>
      <div id="docs" class="doc-grid"></div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin; // Served from same FastAPI app

    let schoolData = [];

    // Load country/school list into dropdowns on page load
    async function loadSchools() {
      const countrySelect = document.getElementById('country');
      const schoolSelect = document.getElementById('school');
      try {
        const res = await fetch(`${API_BASE}/schools`);
        if (!res.ok) throw new Error('Failed to load schools');
        const data = await res.json();
        schoolData = data.countries;

        countrySelect.innerHTML = '<option value="" disabled selected>Select a country</option>';
        schoolData.forEach(group => {
          const opt = document.createElement('option');
          opt.value = group.country;
          opt.textContent = group.country;
          countrySelect.appendChild(opt);
        });

        schoolSelect.innerHTML = '<option value="" disabled selected>Select country first</option>';
        schoolSelect.disabled = true;
      } catch (err) {
        countrySelect.innerHTML = '<option value="" disabled selected>Error loading countries</option>';
        schoolSelect.innerHTML = '<option value="" disabled selected>Error</option>';
        console.error(err);
      }
    }
    loadSchools();

    document.getElementById('country').addEventListener('change', (e) => {
      const country = e.target.value;
      const schoolSelect = document.getElementById('school');
      const group = schoolData.find(g => g.country === country);
      schoolSelect.innerHTML = '<option value="" disabled selected>Select a school</option>';
      if (group) {
        group.schools.forEach(name => {
          const opt = document.createElement('option');
          opt.value = name;
          opt.textContent = name;
          schoolSelect.appendChild(opt);
        });
        schoolSelect.disabled = false;
      } else {
        schoolSelect.disabled = true;
      }
    });

    document.getElementById('genForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const loading = document.getElementById('loading');
      const error = document.getElementById('error');
      const result = document.getElementById('result');

      btn.disabled = true;
      loading.style.display = 'block';
      error.textContent = '';
      result.classList.remove('show');
      document.getElementById('docs').innerHTML = '';

      const payload = {
        doc_type: document.getElementById('docType').value,
        name: document.getElementById('name').value || null,
        school: document.getElementById('school').value || null,
        position: document.getElementById('position').value || null,
        format: 'base64'
      };

      try {
        const res = await fetch(`${API_BASE}/generate`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || `HTTP ${res.status}`);
        }

        const data = await res.json();
        document.getElementById('info').innerHTML = `
          <p><strong>Teacher:</strong> ${data.teacher}</p>
          <p><strong>School:</strong> ${data.school}</p>
          <p><strong>Position:</strong> ${data.position}</p>
          <p><strong>DOB:</strong> ${data.dob}</p>
        `;

        const docsDiv = document.getElementById('docs');
        data.documents.forEach(doc => {
          const card = document.createElement('div');
          card.className = 'doc-card';
          card.innerHTML = `
            <h4>${doc.doc_type.replace(/_/g, ' ').replace(/\b\w/g, l => l.toUpperCase())}</h4>
            <img src="data:image/png;base64,${doc.base64}" alt="${doc.doc_type}">
            <br>
            <a href="${doc.download_url}" download="${doc.filename}">Download PNG</a>
          `;
          docsDiv.appendChild(card);
        });

        result.classList.add('show');
      } catch (err) {
        error.textContent = 'Error: ' + err.message;
      } finally {
        btn.disabled = false;
        loading.style.display = 'none';
      }
    });
  </script>
</body>
</html>
